services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mercado_rodriguez}
      POSTGRES_USER: ${DB_USERNAME:-mercado}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configurar DB_PASSWORD en .env}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
